{% extends 'base.html' %}
{% block content %}
<h2>{{ user['username'] }}</h2>
<p><strong>Email:</strong> {{ user['email'] or '(not set)' }}</p>
<p><strong>Member since:</strong> {{ user['created_at'] }}</p>
<p><strong>Bio:</strong></p>
<div style="border:1px solid #ddd; padding:8px; min-height:40px;">
  {{ user['bio'] | safe }}
</div>
{% if session.user_id %}
<p><a href="{{ url_for('edit_profile', user_id=user['id']) }}">Edit Profile</a></p>
{% endif %}
{% endblock %}
